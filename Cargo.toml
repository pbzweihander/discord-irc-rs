[package]
name = "discord-irc"
version = "1.0.3"
authors = ["pbzweihander <pbzweihander@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
config = "0.15.25"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"
stopper = "0.2.8"
irc = { version = "1.1.0", default-features = false, features = ["ctcp", "tls-rust", "toml_config"] }

[dependencies.serenity]
version = "0.12.5"
default-features = false
features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "http",
    "rustls_backend",
    "utils",
]
